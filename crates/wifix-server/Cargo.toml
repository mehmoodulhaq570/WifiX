[package]
name = "wifix-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Mehmood Ul Haq"]
description = "Shared WifiX local HTTP server for desktop and mobile hosts."
license = "MIT"
repository = "https://github.com/mehmoodulhaq570/WifiX"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
http-body-util = "0.1"
include_dir = "0.7"
qrcode = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["net", "rt-multi-thread", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
wifix-core = { path = "../wifix-core" }
