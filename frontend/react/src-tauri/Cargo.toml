[package]
name = "wifix"
version = "1.0.1"
edition = "2021"
rust-version = "1.77.2"
authors = ["Mehmood Ul Haq"]
description = "WifiX desktop app for secure local area network file sharing with an embedded backend service."
license = "MIT"
repository = "https://github.com/mehmoodulhaq570/WifiX"
homepage = "https://github.com/mehmoodulhaq570/WifiX"
documentation = "https://mehmoodulhaq570.github.io/WifiX/"
readme = "../../README.md"
keywords = ["wifix", "tauri", "lan", "file-sharing", "desktop"]
categories = ["gui", "network-programming"]

[lib]
name = "wifix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
